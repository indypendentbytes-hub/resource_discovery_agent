<!-- IB Tailwind surface reference patterns -->

<!-- Dark-aware sticker card -->
<div class="bg-white dark:bg-[#1E1E1E] text-text-primaryLight dark:text-text-primaryDark rounded-xl border-2 border-ib-denim shadow-sticker p-5 relative">
  <div class="absolute inset-0 bg-soil opacity-15 mix-blend-multiply pointer-events-none"></div>
  <!-- content -->
</div>

<!-- Cream soil panel -->
<div class="relative bg-ib-cream text-text-onCreamLight dark:text-text-onCreamDark rounded-xl p-5">
  <div class="absolute inset-0 bg-soil opacity-15 mix-blend-multiply pointer-events-none"></div>
  <!-- content -->
</div>

<!-- Denim grain divider -->
<div class="h-10 bg-ib-denim text-text-onDenimLight dark:text-text-onDenimDark mask-[url(#grain)]"></div>

<!-- Green soil surface -->
<div class="relative bg-greenSoil text-text-onGreenLight dark:text-text-onGreenDark">
  <div class="absolute inset-0 bg-soil opacity-15 mix-blend-multiply pointer-events-none"></div>
  <!-- content -->
</div>
